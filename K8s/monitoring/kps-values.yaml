# kube-prometheus-stack values for the Capstone 1 EKS cluster

# EKS runs the control plane for us: these endpoints are not reachable,
# so scraping them would only produce permanently "down" targets and alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false   # EKS kube-proxy binds its metrics to 127.0.0.1

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    # Pick up ServiceMonitors/PodMonitors/rules from ANY namespace,
    # not only ones labelled for this Helm release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }

grafana:
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
  # Admin login comes from a Secret created outside git (no password in this file)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Load any ConfigMap labelled grafana_dashboard=1 as a dashboard
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

alertmanager:
  alertmanagerSpec:
    # Mounts Secret "alertmanager-slack" at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"                 # default: drop (Watchdog and other built-ins)
      group_by: [alertname, slo]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: slack-slo          # only SLO alerts reach Slack
          matchers:
            - slo = "web-availability"
    receivers:
      - name: "null"
      - name: slack-slo
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              Policy / runbook: {{ .Annotations.runbook_url }}
              {{ end }}
