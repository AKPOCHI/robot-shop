# Loki in single-binary (monolithic) mode, sized for a 2-node demo cluster.
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # single tenant; no X-Scope-OrgID header needed
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    volume_enabled: true         # powers the log-volume graphs in Grafana
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3            # EBS CSI driver from Step 1
    size: 5Gi
    enableStatefulSetAutoDeletePVC: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# Zero out the components of the other deployment modes
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }

# Off: memcached caches (multi-GiB), the nginx gateway, canary and test pods
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
