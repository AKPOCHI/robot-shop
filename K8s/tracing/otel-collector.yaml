# OpenTelemetry Collector: the project's OTel config (stand-in for the
# instructor's file). Receives OTLP, keeps traces for ONE service (payment),
# batches them and exports to Jaeger.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: tracing
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Protect the Collector from running out of memory under bursts
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      # "One service": drop every span that is not from payment
      filter/one-service:
        error_mode: ignore
        traces:
          span:
            - 'resource.attributes["service.name"] != "payment"'
      # Tag everything with where it came from
      resource:
        attributes:
          - key: deployment.environment
            value: capstone-eks
            action: upsert
      batch: {}

    exporters:
      otlp_grpc/jaeger:
        endpoint: jaeger.tracing.svc.cluster.local:4317
        tls:
          insecure: true          # in-cluster traffic, no TLS between Collector and Jaeger
      debug:
        verbosity: basic          # prints a one-line summary per batch to the Collector log

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/one-service, resource, batch]
          exporters: [otlp_grpc/jaeger, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: tracing
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.145.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          readinessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: tracing
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
